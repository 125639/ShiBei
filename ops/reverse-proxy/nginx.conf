# HTTP/3 can expose :authority through $host while $http_host is empty.
# Preserve explicit ports when available; never send an empty Host upstream.
map $http_host $shibei_public_authority {
    default $http_host;
    ''      $host;
}

# /etc/nginx/conf.d/shibei.conf
# Replace blog.example.com and certificate paths before enabling this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    # Leaves room for multipart overhead around the app's ZIP import limit (512 MB on full/backend; a frontend deployment defaults to 64 MB unless SYNC_MAX_ZIP_MB is raised).
    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $shibei_public_authority;
        proxy_set_header X-Real-IP $remote_addr;
        # Single trusted ingress: discard caller-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $shibei_public_authority;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
