# Checks and real migration tests use disposable CI data. Production builds
# deliberately receive no DATABASE_URL so images never require a live database.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: removal_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d removal_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/removal_audit
      MIGRATION_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/removal_audit
      AUTH_SECRET: ci-only-auth-secret
      ENCRYPTION_KEY: ci-only-encryption-key
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Install browser required by security tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install PostgreSQL client for migration regression tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Lint and typecheck
        run: npm run check
      - name: Unit and isolated PostgreSQL regression tests
        run: npm test
      - name: Full migration chain and seed
        run: |
          npm run prisma:deploy
          npm run db:seed

  production-build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [full, frontend, backend]
    env:
      APP_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build without a database
        run: npm run build
